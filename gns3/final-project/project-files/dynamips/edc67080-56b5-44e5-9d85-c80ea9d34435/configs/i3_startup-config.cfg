!

!
upgrade fpd auto
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DC-R1
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$/T7B$G7oRX9j3WCTuoJwyfkQ5o.
!
no aaa new-model
!
!
!
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name mn521.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username admin2 privilege 15 secret 5 $1$b6uP$ShlqvL5LmJr11rF2hTJUa1
!
redundancy
!
!
ip tcp synwait-time 5
ip ssh version 2
! 
!
!
!
!
!
!
!
interface FastEthernet0/0
 description TRUNK_TO_SWITCH5
 no ip address
 duplex half
 !
!
interface FastEthernet0/0.60
 description VLAN60_SERVERS
 encapsulation dot1Q 60
 ip address 192.168.60.1 255.255.255.0
!
interface FastEthernet0/0.70
 description VLAN70_DATABASE
 encapsulation dot1Q 70
 ip address 192.168.70.1 255.255.255.0
!
interface FastEthernet1/0
 description LINK_TO_R4
 ip address 10.0.34.1 255.255.255.252
 duplex auto
 speed auto
 !
!
interface FastEthernet1/1
 description MGMT_TO_ANSIBLE
 ip address 192.168.100.203 255.255.255.0
 duplex auto
 speed auto
 !
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
 !
!
interface FastEthernet2/1
 no ip address
 shutdown
 duplex auto
 speed auto
 !
!
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 network 10.0.34.0 0.0.0.3 area 0
 network 192.168.60.0 0.0.0.255 area 0
 network 192.168.70.0 0.0.0.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
ip access-list standard ANSIBLE_SSH_ONLY
 permit 192.168.100.10
 deny   any log
!
logging source-interface FastEthernet1/1
logging 192.168.100.10
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
 !
!
!
mgcp fax t38 ecm
mgcp behavior g729-variants static-pt
!
!
!
gatekeeper
 shutdown
!
banner motd WARNING: Authorized access only. Activity may be monitored.
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 access-class ANSIBLE_SSH_ONLY in
 login local
 transport input ssh
!
ntp source FastEthernet1/1
ntp server 192.168.100.10 prefer
end
