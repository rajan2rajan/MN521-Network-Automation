!

!
upgrade fpd auto
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R4
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$ILL7$jB58yYtXzk.BpTOFzyfBc/
!
no aaa new-model
!
!
!
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name mn521.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username admin2 privilege 15 secret 5 $1$XNqZ$clEdvBlKqBrNKba3zJgQZ1
!
redundancy
!
!
ip tcp synwait-time 5
ip ssh version 2
! 
!
!
!
!
!
!
!
interface FastEthernet0/0
 description LINK_TO_R1
 ip address 10.0.14.2 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex half
 !
!
interface FastEthernet1/0
 description LINK_TO_R2
 ip address 10.0.24.2 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
 !
!
interface FastEthernet1/1
 description LINK_TO_R3
 ip address 10.0.34.2 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
 !
!
interface FastEthernet2/0
 description MGMT_TO_ANSIBLE
 ip address 192.168.100.204 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
 !
!
interface FastEthernet2/1
 description NAT_OUTSIDE
 no ip address
 duplex auto
 speed auto
 !
!
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
 passive-interface FastEthernet2/0
 network 10.0.14.0 0.0.0.3 area 0
 network 10.0.24.0 0.0.0.3 area 0
 network 10.0.34.0 0.0.0.3 area 0
 network 192.168.100.0 0.0.0.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
ip nat inside source list NAT_INSIDE interface FastEthernet2/0 overload
!
ip access-list standard ANSIBLE_SSH_ONLY
 permit 192.168.100.10
 deny   any log
ip access-list standard NAT_INSIDE
 permit 192.168.10.0 0.0.0.255
 permit 192.168.20.0 0.0.0.255
 permit 192.168.30.0 0.0.0.255
 permit 192.168.40.0 0.0.0.255
 permit 192.168.50.0 0.0.0.255
 permit 192.168.60.0 0.0.0.255
 permit 192.168.70.0 0.0.0.255
!
logging source-interface FastEthernet2/0
logging 192.168.100.10
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
 !
!
!
mgcp fax t38 ecm
mgcp behavior g729-variants static-pt
!
!
!
gatekeeper
 shutdown
!
banner motd WARNING: Authorized access only. Activity may be monitored.
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 access-class ANSIBLE_SSH_ONLY in
 login local
 transport input ssh
!
ntp source FastEthernet2/0
ntp server 192.168.100.10 prefer
end
